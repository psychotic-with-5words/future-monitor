<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货VWAP监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .status-bar {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-label {
            color: #888;
            font-size: 13px;
        }
        
        .status-value {
            font-weight: bold;
            color: #00d4ff;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #00ff00;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* 配置按钮区域 */
        .config-area {
            text-align: right;
            margin-bottom: 20px;
        }
        
        .config-btn {
            background: #00d4ff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #1a1a2e;
            transition: transform 0.2s;
        }
        
        .config-btn:hover {
            transform: scale(1.02);
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            width: 500px;
            max-width: 90%;
            border: 1px solid #00d4ff;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #00d4ff;
        }
        
        .modal-content label {
            display: block;
            margin-bottom: 5px;
            color: #888;
        }
        
        .modal-content input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #0d1117;
            color: #fff;
        }
        
        .modal-content small {
            color: #666;
            font-size: 12px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-save {
            flex: 1;
            background: #00d4ff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-reset {
            flex: 1;
            background: #ff4444;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        
        .btn-cancel {
            flex: 1;
            background: #666;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .card-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .card-status.above {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }
        
        .card-status.below {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }
        
        .price-area {
            text-align: center;
            margin: 15px 0;
        }
        
        .price {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
        }
        
        .vwap {
            font-size: 18px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .spread {
            font-size: 16px;
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        
        .spread.positive {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
        }
        
        .spread.negative {
            background: rgba(255, 0, 0, 0.1);
            color: #ff4444;
        }
        
        .update-time {
            font-size: 11px;
            color: #666;
            text-align: right;
            margin-top: 10px;
        }
        
        .records-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
        }
        
        .records-title {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .records-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .records-table th,
        .records-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .records-table th {
            color: #888;
            font-weight: normal;
        }
        
        .direction-up {
            color: #00ff00;
        }
        
        .direction-down {
            color: #ff4444;
        }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .badge-up {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }
        
        .badge-down {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }
        
        .records-scroll {
            max-height: 300px;
            overflow-y: auto;
        }
        
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            
            .status-bar {
                flex-direction: column;
            }
        }
    </style>
    <script src="https://cdn.socket.io/4.5.1/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 期货 VWAP 监控面板</h1>
            <p>实时行情监控 | 价格穿越告警 | 跨期价差分析</p>
        </div>
        
        <!-- 配置按钮区域 -->
        <div class="config-area">
            <button class="config-btn" id="openConfigBtn">⚙️ 参数设置</button>
        </div>
        
        <!-- 配置面板模态框 -->
        <div id="configModal" class="modal">
            <div class="modal-content">
                <h2>⚙️ 参数设置</h2>
                
                <div class="form-group">
                    <label>监控合约 (用逗号分隔)</label>
                    <input type="text" id="settingSymbols" placeholder="例如: AG2608, CU2607, FU2609">
                    <small>多个合约用英文逗号分隔</small>
                </div>
                
                <div class="form-group">
                    <label>检查间隔 (秒)</label>
                    <input type="number" id="settingInterval" step="1">
                </div>
                
                <div class="form-group">
                    <label>合约间延迟 (秒)</label>
                    <input type="number" id="settingBatchDelay" step="0.1">
                </div>
                
                <div class="form-group">
                    <label>价格容忍度</label>
                    <input type="number" id="settingTolerance" step="0.1">
                    <small>价格与均价差异小于此值时视为"等于均价"</small>
                </div>
                
                <div class="button-group">
                    <button class="btn-save" id="saveConfigBtn">保存</button>
                    <button class="btn-reset" id="resetConfigBtn">重置</button>
                    <button class="btn-cancel" id="closeConfigBtn">取消</button>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot"></span>
                <span class="status-label">监控状态</span>
                <span class="status-value" id="status-text">运行中</span>
            </div>
            <div class="status-item">
                <span class="status-label">启动时间</span>
                <span class="status-value" id="start-time">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">循环次数</span>
                <span class="status-value" id="loop-count">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">最后更新</span>
                <span class="status-value" id="last-update">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">检查间隔</span>
                <span class="status-value" id="check-interval">5秒</span>
            </div>
        </div>
        
        <div class="cards-grid" id="cards-container"></div>
        
        <div class="records-panel">
            <div class="records-title">
                <span>📋 价格穿越记录</span>
                <span style="font-size: 12px; color: #666;">共 <span id="record-count">0</span> 条记录</span>
            </div>
            <div class="records-scroll">
                <table class="records-table">
                    <thead>
                        <tr><th>时间</th><th>合约</th><th>方向</th><th>价格</th><th>VWAP</th><th>价差</th><th>次数</th></tr>
                    </thead>
                    <tbody id="records-body">
                        <tr><td colspan="7" style="text-align: center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // ========== JavaScript 代码 ==========
        
        let symbols = [];
        let socket = null;
        
        // 更新状态显示
        function updateStatus(status) {
            document.getElementById('start-time').textContent = status.start_time || '--';
            document.getElementById('loop-count').textContent = status.loop_count || 0;
            document.getElementById('last-update').textContent = status.last_update || '--';
        }
        
        // 更新单个卡片
        function updateCard(symbol, data) {
            const priceEl = document.getElementById(`price-${symbol}`);
            const vwapEl = document.getElementById(`vwap-${symbol}`);
            const spreadEl = document.getElementById(`spread-${symbol}`);
            const statusEl = document.getElementById(`status-${symbol}`);
            const timeEl = document.getElementById(`time-${symbol}`);
            
            if (priceEl && data.price) {
                priceEl.textContent = data.price.toFixed(2);
                vwapEl.textContent = data.vwap.toFixed(2);
                
                const spread = data.spread;
                spreadEl.textContent = `价差: ${spread >= 0 ? '+' : ''}${spread.toFixed(2)}`;
                spreadEl.className = `spread ${spread >= 0 ? 'positive' : 'negative'}`;
                
                statusEl.textContent = data.status === 'above' ? '▲ 高于均价' : '▼ 低于均价';
                statusEl.className = `card-status ${data.status === 'above' ? 'above' : 'below'}`;
                
                timeEl.textContent = `更新: ${data.last_update || new Date().toLocaleTimeString()}`;
            }
        }
        
        // 添加穿越记录
        function addCrossRecord(record) {
            const tbody = document.getElementById('records-body');
            
            if (tbody.children.length === 1 && tbody.children[0].innerHTML.includes('加载中')) {
                tbody.innerHTML = '';
            }
            
            const isUp = record.direction.includes('低于均价 → 高于均价');
            const row = tbody.insertRow(0);
            row.innerHTML = `
                <td>${record.time}</td>
                <td><strong>${record.symbol}</strong></td>
                <td><span class="badge ${isUp ? 'badge-up' : 'badge-down'}">${record.direction}</span></td>
                <td>${record.price.toFixed(2)}</td>
                <td>${record.vwap.toFixed(2)}</td>
                <td class="${record.spread >= 0 ? 'direction-up' : 'direction-down'}">${record.spread >= 0 ? '+' : ''}${record.spread.toFixed(2)}</td>
                <td>第${record.count}次</td>
            `;
            
            while (tbody.children.length > 50) {
                tbody.removeChild(tbody.lastChild);
            }
            
            document.getElementById('record-count').textContent = tbody.children.length;
        }
        
        // 加载历史数据
        async function loadHistory() {
            try {
                const response = await fetch('/api/market_data');
                const result = await response.json();
                
                if (result.data) {
                    for (const [symbol, data] of Object.entries(result.data)) {
                        if (data.price) {
                            updateCard(symbol, data);
                        }
                    }
                }
                
                if (result.status) {
                    updateStatus(result.status);
                }
                
                const recordsResponse = await fetch('/api/cross_records?limit=50');
                const records = await recordsResponse.json();
                
                const tbody = document.getElementById('records-body');
                tbody.innerHTML = '';
                
                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">暂无穿越记录</td></tr>';
                } else {
                    [...records].reverse().forEach(record => {
                        const isUp = record.direction.includes('低于均价 → 高于均价');
                        const row = tbody.insertRow(0);
                        row.innerHTML = `
                            <td>${record.time}</td>
                            <td><strong>${record.symbol}</strong></td>
                            <td><span class="badge ${isUp ? 'badge-up' : 'badge-down'}">${record.direction}</span></td>
                            <td>${record.price.toFixed(2)}</td>
                            <td>${record.vwap.toFixed(2)}</td>
                            <td class="${record.spread >= 0 ? 'direction-up' : 'direction-down'}">${record.spread >= 0 ? '+' : ''}${record.spread.toFixed(2)}</td>
                            <td>第${record.count}次</td>
                        `;
                    });
                    document.getElementById('record-count').textContent = records.length;
                }
            } catch(e) {
                console.error('加载历史数据失败:', e);
            }
        }
        
        // 初始化卡片
        function initCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            symbols.forEach(symbol => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${symbol}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${symbol}</span>
                        <span class="card-status" id="status-${symbol}">等待数据</span>
                    </div>
                    <div class="price-area">
                        <div class="price" id="price-${symbol}">--</div>
                        <div class="vwap">VWAP: <span id="vwap-${symbol}">--</span></div>
                    </div>
                    <div class="spread" id="spread-${symbol}">价差: --</div>
                    <div class="update-time" id="time-${symbol}">--</div>
                `;
                container.appendChild(card);
            });
        }
        
        // 获取合约列表
        async function loadSymbols() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                symbols = data.symbols;
                initCards();
                loadHistory();
            } catch(e) {
                console.error('加载配置失败:', e);
                symbols = ['AG2608', 'CU2607', 'FU2609'];
                initCards();
                loadHistory();
            }
        }
        
        // ========== 配置面板功能 ==========
        
        async function loadConfigToForm() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                document.getElementById('settingSymbols').value = data.symbols.join(', ');
                document.getElementById('settingInterval').value = data.check_interval;
                document.getElementById('settingBatchDelay').value = data.batch_delay;
                document.getElementById('settingTolerance').value = data.tolerance;
            } catch(e) {
                console.error('加载配置失败:', e);
            }
        }
        
        async function saveConfig() {
            const symbolsStr = document.getElementById('settingSymbols').value;
            const symbolsList = symbolsStr.split(',').map(s => s.trim().toUpperCase()).filter(s => s);
            
            const configData = {
                symbols: symbolsList,
                check_interval: parseInt(document.getElementById('settingInterval').value),
                batch_delay: parseFloat(document.getElementById('settingBatchDelay').value),
                tolerance: parseFloat(document.getElementById('settingTolerance').value)
            };
            
            try {
                const response = await fetch('/api/config/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(configData)
                });
                const result = await response.json();
                if (result.success) {
                    alert('配置已保存，将自动生效');
                    closeConfigModal();
                    document.getElementById('check-interval').textContent = configData.check_interval + '秒';
                    symbols = configData.symbols;
                    initCards();
                } else {
                    alert('保存失败: ' + result.error);
                }
            } catch(e) {
                alert('保存失败: ' + e.message);
            }
        }
        
        async function resetConfig() {
            if (confirm('重置配置将恢复到默认值，确定吗？')) {
                try {
                    const response = await fetch('/api/config/reset', { method: 'POST' });
                    const result = await response.json();
                    if (result.success) {
                        await loadConfigToForm();
                        alert('配置已重置');
                        document.getElementById('check-interval').textContent = result.config.check_interval + '秒';
                        symbols = result.config.symbols;
                        initCards();
                    }
                } catch(e) {
                    alert('重置失败: ' + e.message);
                }
            }
        }
        
        function openConfigModal() {
            loadConfigToForm();
            document.getElementById('configModal').style.display = 'flex';
        }
        
        function closeConfigModal() {
            document.getElementById('configModal').style.display = 'none';
        }
        
        // 初始化 WebSocket
        function initSocket() {
            socket = io();
            
            socket.on('connect', () => {
                console.log('WebSocket 已连接');
            });
            
            socket.on('market_update', (data) => {
                updateCard(data.symbol, {
                    price: data.price,
                    vwap: data.vwap,
                    spread: data.spread,
                    status: data.status,
                    last_update: new Date().toLocaleTimeString()
                });
            });
            
            socket.on('cross_alert', (record) => {
                addCrossRecord(record);
            });
            
            socket.on('config_updated', (config) => {
                console.log('配置已更新:', config);
                document.getElementById('check-interval').textContent = config.check_interval + '秒';
                symbols = config.symbols;
                initCards();
            });
            
            socket.on('disconnect', () => {
                console.log('WebSocket 已断开');
            });
        }
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', () => {
            loadSymbols();
            initSocket();
            
            // 绑定按钮事件
            document.getElementById('openConfigBtn').onclick = openConfigModal;
            document.getElementById('saveConfigBtn').onclick = saveConfig;
            document.getElementById('resetConfigBtn').onclick = resetConfig;
            document.getElementById('closeConfigBtn').onclick = closeConfigModal;
            
            setInterval(async () => {
                try {
                    const response = await fetch('/api/status');
                    const status = await response.json();
                    updateStatus(status);
                } catch(e) {}
            }, 5000);
        });
    </script>
</body>
</html>
